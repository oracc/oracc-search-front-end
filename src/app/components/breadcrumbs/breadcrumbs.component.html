<div class="bcrumbs">
  <div class="container bcrumbs__container">
    <ul class="bcrumbs__list">
      <li class="bcrumbs__list-item" routerLink="/">
        {{ "breadcrumbs.homeText" | translate }}
      </li>
      <li
        class="bcrumbs__list-item js-list-item"
        *ngFor="let link of breadcrumbsLinks; let i = index"
        (click)="handleBreadcrumbClick(i)"
        data-id="{{ link.url }}"
      >
        <i class="fas fa-arrow-left bcrumbs__list-icon"></i>
        <span *ngIf="['search results', 'occurrences', 'texts'].includes(link.name); else notTranslated">{{ "breadcrumbs." + link.name | translate }}</span>
        <ng-template #notTranslated>{{ link.name }}</ng-template>
      </li>
    </ul>
  </div>
</div>
