<div class="search">
  <div class="container content search__content">
    <div class="search__heading">
      <h2 class="search__title">{{ "search.titleText" | translate }}</h2>
      <span class="search__intro">{{ "search.introText" | translate }}</span>
    </div>
    <div class="search__form">
      <div class="search-input__container">
        <input
          autocomplete="off"
          type="text"
          name="search"
          class="search__input js-search-input"
          [placeholder]="'search.placeholderText' | translate"
          [(ngModel)]="searchParam"
          (ngModelChange)="setShowSuggestions(true)"
          (keyup.enter)="searchOnEnter($event)"
          (keyup.arrowdown)="focusSuggestions()"
          />
        @if (showSuggestions) {
          <app-search-suggestions
            [searchParam]="searchParam"
            (setSuggestionSearchParam)="setSuggestionSearchParam($event)"
            (setShowSuggestions)="setShowSuggestions($event)"
          ></app-search-suggestions>
        }
      </div>

      <button
        class="btn search__btn js-search-btn"
        routerLink="search-results"
        (click)="setSearchParam(searchParam)"
        >
        <i class="fa fa-search"></i>{{ "search.buttonText" | translate }}
      </button>
    </div>
    <router-outlet></router-outlet>
  </div>
</div>
